<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinePass Quota</title>
<style>
:root {
  --bg-primary: #f0eee8;
  --bg-secondary: #faf9f5;
  --bg-tertiary: #e9e6df;
  --text-primary: #2d2a26;
  --text-secondary: #6d6760;
  --text-tertiary: #a29c95;
  --border-color: #e3e1db;
  --primary-color: #8b8680;
  --primary-hover: #7f7a74;
  --success-color: #188038;
  --warning-color: #b06000;
  --error-color: #b3261e;
  --radius-md: 8px;
  --shadow: 0 1px 3px rgba(45, 42, 38, .12);
}
[data-theme="white"] {
  --bg-primary: #f0eee8;
  --bg-secondary: #faf9f5;
  --bg-tertiary: #e9e6df;
  --text-primary: #2d2a26;
  --text-secondary: #6d6760;
  --text-tertiary: #a29c95;
  --border-color: #e3e1db;
}
[data-theme="dark"] {
  --bg-primary: #1d1b18;
  --bg-secondary: #151412;
  --bg-tertiary: #262320;
  --text-primary: #f0eee8;
  --text-secondary: #b8b1a8;
  --text-tertiary: #8d867e;
  --border-color: #3c3833;
  --primary-color: #8f8981;
  --primary-hover: #a29b92;
  --shadow: 0 1px 3px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; padding: 32px; color: var(--text-primary); background: var(--bg-secondary); font: 14px/1.45 system-ui, sans-serif; }
.quota-page { max-width: 1160px; margin: 0 auto; }
.quota-header { margin-bottom: 24px; }
.quota-title { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; }
.quota-description { margin: 8px 0 0; color: var(--text-secondary); }
.quota-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
.quota-card { padding: 20px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: var(--shadow); }
.quota-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.credential-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: var(--primary-color); font-size: 12px; font-weight: 700; }
.credential-name { margin: 0; min-width: 0; overflow-wrap: anywhere; font-size: 16px; font-weight: 600; }
.quota-row { padding: 14px 0; border-top: 1px solid var(--border-color); }
.quota-row-header, .quota-meta { display: flex; justify-content: space-between; gap: 12px; }
.quota-label { font-weight: 600; text-transform: capitalize; }
.quota-percent { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.quota-track { height: 8px; margin: 8px 0 6px; overflow: hidden; border-radius: 999px; background: var(--bg-tertiary); }
.quota-fill { height: 100%; border-radius: inherit; background: var(--success-color); transition: width .2s ease; }
.quota-meta { color: var(--text-secondary); font-size: 12px; }
.quota-actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.quota-refresh { border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; color: var(--text-primary); background: var(--bg-tertiary); font: inherit; font-size: 12px; cursor: pointer; }
.quota-refresh:hover { border-color: var(--primary-color); background: var(--bg-primary); }
.quota-refresh:disabled { cursor: not-allowed; opacity: .6; }
.quota-error { color: var(--error-color); }
.quota-warning { color: var(--warning-color); }
.quota-muted { color: var(--text-secondary); }
@media (max-width: 768px) {
  body { padding: 20px 16px; }
  .quota-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="quota-page">
  <header class="quota-header"><h1 class="quota-title">ClinePass Quota</h1><p class="quota-description">5-hour rolling, weekly, and monthly usage for each configured ClinePass key. Refresh cards individually.</p></header>
  <main id="app"><p class="quota-muted">Loading credentials...</p></main>
</div>
<script>
(() => {
  try {
    const parentDocument = window.parent && window.parent !== window ? window.parent.document : null;
    const parentRoot = parentDocument && parentDocument.documentElement;
    const syncTheme = () => {
      if (!parentRoot) return;
      const theme = parentRoot.getAttribute("data-theme");
      if (theme === "white" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      else document.documentElement.removeAttribute("data-theme");
      const secondary = getComputedStyle(parentRoot).getPropertyValue("--bg-secondary").trim();
      if (secondary) document.documentElement.style.setProperty("--bg-secondary", secondary);
      document.body.style.backgroundColor = secondary || "var(--bg-secondary)";
      if (window.frameElement) {
        window.frameElement.style.backgroundColor = secondary || "transparent";
        if (window.frameElement.parentElement) window.frameElement.parentElement.style.backgroundColor = secondary || "transparent";
      }
    };
    syncTheme();
    if (parentRoot) new MutationObserver(syncTheme).observe(parentRoot, {attributes: true, attributeFilter: ["data-theme"]});
  } catch (_) {}
})();
</script>
<script>
(() => {
  const app = document.getElementById("app");
  const endpoint = "/v0/management/plugins/clinepass-quota-cliproxyapi/quota-usage";
  const storageKey = "clinepass-quota-cliproxyapi:quota";
  const values = new Map();
  const fetchedAt = new Map();
  let cache = {};
  try {
    const stored = sessionStorage.getItem(storageKey);
    const parsed = stored ? JSON.parse(stored) : {};
    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) cache = parsed;
  } catch (_) {}
  Object.entries(cache).forEach(([keyID, entry]) => {
    if (!entry || typeof entry !== "object" || !entry.usage || typeof entry.usage !== "object") return;
    values.set(keyID, entry.usage);
    if (typeof entry.fetched_at === "string") fetchedAt.set(keyID, entry.fetched_at);
  });
  function saveCache() {
    try { sessionStorage.setItem(storageKey, JSON.stringify(cache)); } catch (_) {}
  }
  function auth() {
    const raw = localStorage.getItem("cli-proxy-auth");
    if (!raw) return "";
    try {
      let decoded = raw;
      if (raw.startsWith("enc::v1::")) {
        const bytes = Uint8Array.from(atob(raw.slice(9)), char => char.charCodeAt(0));
        const seed = new TextEncoder().encode("cli-proxy-api-webui::secure-storage|" + location.host + "|" + navigator.userAgent);
        for (let i = 0; i < bytes.length; i++) bytes[i] ^= seed[i % seed.length];
        decoded = new TextDecoder().decode(bytes);
      }
      const parsed = JSON.parse(decoded);
      if (parsed && parsed.state && parsed.state.managementKey) return typeof parsed.state.managementKey === "string" ? parsed.state.managementKey : "";
      return "";
    } catch (_) { return ""; }
  }
  function request(body) {
    const headers = {"Content-Type": "application/json"};
    const key = auth();
    if (key) headers.Authorization = "Bearer " + key;
    return fetch(endpoint, {method: "POST", headers, body: JSON.stringify(body)}).then(async response => {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    });
  }
  function text(parent, value) { const node = document.createElement("span"); node.textContent = value == null || value === "" ? "-" : value; parent.appendChild(node); }
  // Ported from CLIProxyAPI's own Management Center (the native quota UI
  // used for Claude/Codex/Kimi/etc): src/utils/quota/resetInstants.ts
  // (parseIsoToMs) and src/utils/quota/relativeTime.ts (relativeTimeParts,
  // formatInstantShort, formatRelativeInstant), so this plugin's reset
  // labels match the native "MM-DD HH:mm · in X days" rendering exactly.
  const DAY_MS = 86400000, HOUR_MS = 3600000, MINUTE_MS = 60000;
  function parseIsoToMs(value) {
    if (typeof value !== "string") return null;
    const trimmed = value.trim();
    if (!trimmed) return null;
    // Tolerates the over-precise fractional seconds some providers emit
    // (e.g. Go's nanosecond RFC3339Nano), which `new Date()` rejects on some engines.
    const normalized = trimmed.replace(/(\.\d{6})\d+/, "$1");
    const ms = new Date(normalized).getTime();
    return Number.isFinite(ms) ? ms : null;
  }
  function relativeTimeParts(targetMs, nowMs) {
    const delta = targetMs - nowMs;
    const sign = delta < 0 ? -1 : 1;
    const abs = Math.abs(delta);
    if (abs >= DAY_MS) {
      // Weekly/monthly windows land here and previously truncated to whole
      // days only, losing up to 23 hours of precision (a monthly reset
      // showing "in 12 days" whether it is 12d 1h or 12d 23h away). Carries
      // the remainder hours alongside the day count, same rationale as the
      // hour bucket's remainder minutes below.
      const days = Math.floor(abs / DAY_MS);
      const hours = Math.floor((abs % DAY_MS) / HOUR_MS);
      return {value: sign * days, unit: "day", hours};
    }
    if (abs >= HOUR_MS) {
      // Hour-only granularity truncates away up to 59 minutes of real
      // precision right where it matters most (an imminent reset), so this
      // bucket carries the remainder minutes alongside the hour count
      // instead of reusing the single-unit Intl.RelativeTimeFormat call.
      const hours = Math.floor(abs / HOUR_MS);
      const minutes = Math.floor((abs % HOUR_MS) / MINUTE_MS);
      return {value: sign * hours, unit: "hour", minutes};
    }
    return {value: sign * Math.max(1, Math.floor(abs / MINUTE_MS)), unit: "minute"};
  }
  let relativeFormatter = null;
  function getRelativeFormatter() {
    if (!relativeFormatter) {
      try { relativeFormatter = new Intl.RelativeTimeFormat(undefined, {numeric: "always"}); }
      catch (_) { relativeFormatter = new Intl.RelativeTimeFormat("en", {numeric: "always"}); }
    }
    return relativeFormatter;
  }
  function formatRelativeInstant(targetMs, nowMs) {
    const parts = relativeTimeParts(targetMs, nowMs);
    if (parts.unit === "day" && parts.hours > 0) {
      const days = Math.abs(parts.value);
      const compact = days + "d " + parts.hours + "h";
      return parts.value < 0 ? compact + " ago" : "in " + compact;
    }
    if (parts.unit === "hour" && parts.minutes > 0) {
      const hours = Math.abs(parts.value);
      const compact = hours + "h " + parts.minutes + "m";
      return parts.value < 0 ? compact + " ago" : "in " + compact;
    }
    return getRelativeFormatter().format(parts.value, parts.unit);
  }
  function formatInstantShort(ms) {
    if (!Number.isFinite(ms)) return "-";
    return new Date(ms).toLocaleString(undefined, {month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false});
  }
  function formatReset(iso) {
    const ms = parseIsoToMs(iso);
    if (ms === null) return "-";
    return formatInstantShort(ms) + " · " + formatRelativeInstant(ms, Date.now());
  }
  function renderUsage(row, usage) {
    const value = document.createElement("div"); value.className = "quota-percent";
    const track = document.createElement("div"); track.className = "quota-track";
    const fill = document.createElement("div"); fill.className = "quota-fill";
    const percent = Math.max(0, Math.min(100, Number(usage.percent) || 0));
    fill.style.width = percent + "%";
    track.setAttribute("role", "progressbar"); track.setAttribute("aria-valuemin", "0"); track.setAttribute("aria-valuemax", "100"); track.setAttribute("aria-valuenow", String(percent)); track.setAttribute("aria-label", "Quota used"); track.appendChild(fill);
    value.textContent = percent + "%";
    const meta = document.createElement("div"); meta.className = "quota-meta"; text(meta, "resets " + formatReset(usage.resets_at));
    row.append(value, track, meta);
  }
  function render(cards) {
    app.textContent = "";
    if (!cards.length) { const p = document.createElement("p"); p.className = "quota-muted"; p.setAttribute("role", "status"); p.textContent = "No configured credentials."; app.appendChild(p); return; }
    const grid = document.createElement("div"); grid.className = "quota-grid";
    cards.forEach((card, cardIndex) => {
      const section = document.createElement("section"); section.className = "quota-card";
      const header = document.createElement("div"); header.className = "quota-card-header";
      const badge = document.createElement("span"); badge.className = "credential-badge"; badge.textContent = "CP"; badge.setAttribute("aria-hidden", "true");
      const title = document.createElement("h2"); title.className = "credential-name"; title.textContent = card.name ? "ClinePass · " + card.name : "ClinePass"; header.append(badge, title); section.appendChild(header);
      [["rolling", "5-hour"], ["weekly", "Weekly"], ["monthly", "Monthly"]].forEach(([name, display]) => {
        const row = document.createElement("div"); row.className = "quota-row";
        const rowHeader = document.createElement("div"); rowHeader.className = "quota-row-header"; const label = document.createElement("span"); label.className = "quota-label"; label.textContent = display; rowHeader.appendChild(label); row.appendChild(rowHeader);
       const usage = values.get(card.key_id) && values.get(card.key_id)[name];
         if (usage) renderUsage(row, usage); else { const pending = document.createElement("div"); pending.className = "quota-meta"; pending.textContent = "Not refreshed"; row.appendChild(pending); }
         section.appendChild(row);
       });
      const updated = fetchedAt.get(card.key_id);
      if (updated) { const timestamp = document.createElement("div"); timestamp.className = "quota-meta"; timestamp.textContent = "Updated " + new Date(updated).toLocaleString(); section.appendChild(timestamp); }
      const actions = document.createElement("div"); actions.className = "quota-actions";
      const button = document.createElement("button"); button.className = "quota-refresh"; button.textContent = "Refresh"; button.setAttribute("aria-label", card.name ? "Refresh ClinePass " + card.name : "Refresh ClinePass credential " + (cardIndex + 1));
      const error = document.createElement("span"); error.className = "quota-error"; error.setAttribute("role", "status");
      button.onclick = () => { button.disabled = true; error.textContent = ""; request({key_id: card.key_id}).then(result => { const timestamp = new Date().toISOString(); values.set(card.key_id, result.usage); fetchedAt.set(card.key_id, timestamp); cache[card.key_id] = {usage: result.usage, fetched_at: timestamp}; saveCache(); render(cards); }).catch(err => { error.textContent = err.message || "Refresh failed"; button.disabled = false; }); };
      actions.append(button, error); section.appendChild(actions); grid.appendChild(section);
    });
    app.appendChild(grid);
  }
  if (!auth()) { app.textContent = ""; const p = document.createElement("p"); p.className = "quota-error"; p.setAttribute("role", "status"); p.textContent = "Enable Remember password in Management Center to use this page."; app.appendChild(p); return; }
  request({}).then(result => { const cards = result.cards || []; const configured = new Set(cards.map(card => card.key_id)); Object.keys(cache).forEach(keyID => { if (!configured.has(keyID)) { delete cache[keyID]; values.delete(keyID); fetchedAt.delete(keyID); } }); saveCache(); render(cards); }).catch(err => { app.textContent = ""; const p = document.createElement("p"); p.className = "quota-error"; p.setAttribute("role", "status"); p.textContent = err.message || "Unable to load credentials."; app.appendChild(p); });
})();
</script>
</body>
</html>
